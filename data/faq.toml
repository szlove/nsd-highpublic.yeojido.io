[[items]]
  question = "카르마 매장은 어디쯤인가요?"
  answer = "낙성대 하이퍼블릭 카르마는 서울 관악구 봉천동에 위치해 있어요. 오시는 길이 헷갈리시면 전화로 안내받으실 수 있어요."
[[items]]
  question = "운영 시간을 알고 싶어요"
  answer = "매일 18:00부터 다음날 15:00까지 문을 열어요. 늦은 밤에도 예약이나 문의를 받고 있어요."
[[items]]
  question = "전화 상담은 몇 시에 가능한가요?"
  answer = "010-7456-5410으로 영업시간 중 상담 가능해요. 원하시는 시간과 인원을 미리 알려주시면 응대가 더 빨라요."
[[items]]
  question = "가격대가 궁금합니다"
  answer = "1인 200,000원, 2인 300,000원, 3인 420,000원, 4인 560,000원입니다. 정확한 금액은 010-7456-5410으로 확인해 주세요."
